.msg{stroke:#5F5E5A;stroke-width:1;stroke-dasharray:5 4;fill:none}
.ev{fill:#F1EFE8;stroke:#888780;stroke-width:1}
.end{fill:#F1EFE8;stroke:#444441;stroke-width:2.5}
.in{fill:none;stroke:#5F5E5A;stroke-width:1}
.x{stroke:#2C2C2A;stroke-width:1.5}
.t{font-size:12px;fill:#2C2C2A;text-anchor:middle;dominant-baseline:central}
.tl{font-size:12px;fill:#2C2C2A;dominant-baseline:central}
.th{font-size:14px;font-weight:bold;fill:#2C2C2A;text-anchor:middle;dominant-baseline:central}
.tp{font-size:12px;fill:#3C3489;text-anchor:middle;dominant-baseline:central}
</style>
