<svg xmlns="http://www.w3.org/2000/svg" width="680" height="618" viewBox="0 0 680 618" font-family="Arial, Helvetica, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>BPMN del ciclo de un expediente de mensura con anticipo</title>
<desc>Tres pools: Cliente, Estudio con cuatro lanes (Comercial, Sistema, Administrativa, Técnica) y Organismo catastral. Dos compuertas exclusivas: aceptación del presupuesto y aprobación del plano.</desc>
