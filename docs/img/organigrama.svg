<svg xmlns="http://www.w3.org/2000/svg" width="680" height="490" viewBox="0 0 680 490" font-family="Arial, Helvetica, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>Organigrama piramidal vertical del estudio de ingeniería y agrimensura</title>
<desc>Dirección general en el vértice, dos asesorías de staff con línea de trazos, tres áreas funcionales y sus departamentos dependientes.</desc>
<style>
.ln{stroke:#2C2C2A;stroke-width:1;fill:none}
.dash{stroke:#2C2C2A;stroke-width:1;stroke-dasharray:6 4;fill:none}
.th{font-size:14px;font-weight:bold;text-anchor:middle;dominant-baseline:central}
.ts{font-size:12px;text-anchor:middle;dominant-baseline:central}
.lg{font-size:12px;dominant-baseline:central}
.top{fill:#EEEDFE;stroke:#534AB7;stroke-width:1}
.area{fill:#E1F5EE;stroke:#0F6E56;stroke-width:1}
.dep{fill:#F1EFE8;stroke:#5F5E5A;stroke-width:1}
</style>
<rect width="680" height="490" fill="#FFFFFF"/>

<line class="ln" x1="340" y1="80" x2="340" y2="170"/>
<line class="dash" x1="200" y1="127" x2="340" y2="127"/>
<line class="dash" x1="340" y1="127" x2="480" y2="127"/>
<line class="ln" x1="125" y1="170" x2="555" y2="170"/>
<line class="ln" x1="125" y1="170" x2="125" y2="200"/>
<line class="ln" x1="340" y1="170" x2="340" y2="200"/>
<line class="ln" x1="555" y1="170" x2="555" y2="200"/>

<rect class="top" x="240" y="30" width="200" height="50"/>
<text class="th" x="340" y="47" fill="#3C3489">Dirección general</text>
<text class="ts" x="340" y="65" fill="#534AB7">Conducción del estudio</text>

<rect class="dep" x="30" y="102" width="170" height="50"/>
<text class="th" x="115" y="119" fill="#2C2C2A">Asesoría legal</text>
<text class="ts" x="115" y="137" fill="#5F5E5A">Staff externo</text>
<rect class="dep" x="480" y="102" width="170" height="50"/>
<text class="th" x="565" y="119" fill="#2C2C2A">Asesoría contable</text>
<text class="ts" x="565" y="137" fill="#5F5E5A">Staff externo</text>

<rect class="area" x="30" y="200" width="190" height="50"/>
<text class="th" x="125" y="217" fill="#085041">Área técnica</text>
<text class="ts" x="125" y="235" fill="#0F6E56">Proyectos y mensuras</text>
<rect class="area" x="245" y="200" width="190" height="50"/>
<text class="th" x="340" y="217" fill="#085041">Área administrativa</text>
<text class="ts" x="340" y="235" fill="#0F6E56">Gestión interna</text>
<rect class="area" x="460" y="200" width="190" height="50"/>
<text class="th" x="555" y="217" fill="#085041">Área comercial</text>
<text class="ts" x="555" y="235" fill="#0F6E56">Relación con clientes</text>

<line class="ln" x1="42" y1="250" x2="42" y2="393"/>
<line class="ln" x1="42" y1="293" x2="60" y2="293"/>
<line class="ln" x1="42" y1="343" x2="60" y2="343"/>
<line class="ln" x1="42" y1="393" x2="60" y2="393"/>
<rect class="dep" x="60" y="275" width="160" height="36"/>
<text class="ts" x="140" y="293" fill="#2C2C2A" font-size="14">Agrimensura</text>
<rect class="dep" x="60" y="325" width="160" height="36"/>
<text class="ts" x="140" y="343" fill="#2C2C2A" font-size="14">Ingeniería civil</text>
<rect class="dep" x="60" y="375" width="160" height="36"/>
<text class="ts" x="140" y="393" fill="#2C2C2A" font-size="14">Dibujo y SIG</text>

<line class="ln" x1="257" y1="250" x2="257" y2="343"/>
<line class="ln" x1="257" y1="293" x2="275" y2="293"/>
<line class="ln" x1="257" y1="343" x2="275" y2="343"/>
<rect class="dep" x="275" y="275" width="160" height="36"/>
<text class="ts" x="355" y="293" fill="#2C2C2A" font-size="14">Contabilidad</text>
<rect class="dep" x="275" y="325" width="160" height="36"/>
<text class="ts" x="355" y="343" fill="#2C2C2A" font-size="14">Compras</text>

<line class="ln" x1="472" y1="250" x2="472" y2="343"/>
<line class="ln" x1="472" y1="293" x2="490" y2="293"/>
<line class="ln" x1="472" y1="343" x2="490" y2="343"/>
<rect class="dep" x="490" y="275" width="160" height="36"/>
<text class="ts" x="570" y="293" fill="#2C2C2A" font-size="14">Presupuestos</text>
<rect class="dep" x="490" y="325" width="160" height="36"/>
<text class="ts" x="570" y="343" fill="#2C2C2A" font-size="14">Trámites oficiales</text>

<line class="ln" x1="40" y1="451" x2="80" y2="451"/>
<text class="lg" x="90" y="451" fill="#2C2C2A">Autoridad lineal</text>
<line class="dash" x1="260" y1="451" x2="300" y2="451"/>
<text class="lg" x="310" y="451" fill="#2C2C2A">Relación de staff (asesoría)</text>
</svg>
